<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000">
<title>Hand Music</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: #000; color: #fff; overflow: hidden;
    font: 16px/1.3 system-ui, -apple-system, sans-serif; touch-action: none;
    -webkit-user-select: none; user-select: none; }
  video, canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  video { object-fit: cover; transform: scaleX(-1); opacity: .55; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: linear-gradient(transparent, rgba(0,0,0,.8)); }
  #bar button { flex: 1; min-width: 0; padding: 10px 4px; border-radius: 14px;
    border: 1px solid rgba(255,255,255,.25); background: rgba(20,20,24,.7); color: #fff;
    font: inherit; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #bar small { display: block; font-size: 11px; opacity: .6; text-transform: uppercase; letter-spacing: .08em; }
  #bar b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 16px; right: 16px;
    text-align: center; font-size: 14px; opacity: .8; pointer-events: none; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center; padding: 24px; text-align: center; background: #000; }
  #start h1 { font-size: 32px; }
  #start p { opacity: .7; max-width: 320px; }
  #start button { width: 260px; padding: 16px; border-radius: 16px; border: 0; font: 600 17px system-ui; }
  #camBtn { background: #ffcc4d; color: #000; }
  #touchBtn { background: #222; color: #fff; }
</style>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<canvas id="canvas"></canvas>
<div id="status"></div>
<div id="bar">
  <button id="keyBtn"><small>Key</small><b></b></button>
  <button id="scaleBtn"><small>Scale</small><b></b></button>
  <button id="instBtn"><small>Sound</small><b></b></button>
  <button id="clearBtn"><small>Strings</small><b>Clear</b></button>
</div>
<div id="start">
  <h1>Hand Music</h1>
  <p>Stand your phone up so it sees both hands.<br>
     <b>Make a string:</b> pinch thumb and index, drag, let go.<br>
     <b>Play:</b> sweep your thumb or index fingertip through a string.</p>
  <button id="camBtn">Start with camera</button>
  <button id="touchBtn">Play with touch only</button>
</div>

<script type="module">
const NOTES = ['Do', 'Do#', 'Re', 'Re#', 'Mi', 'Fa', 'Fa#', 'Sol', 'Sol#', 'La', 'La#', 'Si'];
const SCALES = {
  'Pentatonic':  [0, 2, 4, 7, 9],
  'Minor penta': [0, 3, 5, 7, 10],
  'Major':       [0, 2, 4, 5, 7, 9, 11],
  'Minor':       [0, 2, 3, 5, 7, 8, 10],
  'Blues':       [0, 3, 5, 6, 7, 10],
  'Hijaz':       [0, 1, 4, 5, 7, 8, 10],
};
// Recorded instruments from the FluidR3 General MIDI soundfont (CC BY 3.0), one mp3 per note
const INSTRUMENTS = { Guitar: 'acoustic_guitar_nylon', Piano: 'acoustic_grand_piano', Harp: 'orchestral_harp' };
const SAMPLE_URL = 'https://gleitz.github.io/midi-js-soundfonts/FluidR3_GM';
const FILE_NOTES = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B']; // how the sample files are named
const TIPS = [4, 8]; // MediaPipe landmark ids of the fingertips that play: thumb and index
// pairs of landmarks to join when drawing the hand: thumb, 4 fingers, palm
const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
const MAX_STRINGS = 12;

const state = { key: 9, scale: 'Minor penta', inst: 'Guitar' }; // starts in La minor pentatonic
// strings hold positions as fractions of the screen (0..1) so they survive rotation
let strings = [];

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
let audio, W, H;

// ---------- strings and notes ----------
function defaultStrings() {
  return Array.from({ length: 6 }, (_, i) => {
    const y = 0.8 - i * 0.12; // lowest note at the bottom
    return { a: { x: 0.1, y }, b: { x: 0.9, y }, hitAt: -1e9 };
  });
}

// the i-th string plays the i-th note of the scale, going up from the key in octave 3
function midiFor(i) {
  const steps = SCALES[state.scale];
  return 48 + state.key + steps[i % steps.length] + 12 * Math.floor(i / steps.length);
}

function refresh() {
  document.querySelector('#keyBtn b').textContent = NOTES[state.key];
  document.querySelector('#scaleBtn b').textContent = state.scale;
  document.querySelector('#instBtn b').textContent = state.inst;
  // download every note a string could need (about 20 KB each), so new strings sound right away
  if (audio) for (let i = 0; i < MAX_STRINGS; i++) loadSample(midiFor(i));
}

function resize() {
  const dpr = devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize);

const cycle = (list, cur) => list[(list.indexOf(cur) + 1) % list.length];
document.getElementById('keyBtn').onclick = () => { state.key = (state.key + 1) % 12; refresh(); };
document.getElementById('scaleBtn').onclick = () => { state.scale = cycle(Object.keys(SCALES), state.scale); refresh(); };
document.getElementById('instBtn').onclick = () => { state.inst = cycle(Object.keys(INSTRUMENTS), state.inst); refresh(); };
document.getElementById('clearBtn').onclick = () => { strings = []; for (const h in drafts) delete drafts[h]; };

// ---------- sound ----------
const samples = {}; // "instrument/midi" -> AudioBuffer, or a Promise while loading

function loadSample(midi) {
  const name = INSTRUMENTS[state.inst];
  const id = `${name}/${midi}`;
  if (!samples[id]) {
    const file = FILE_NOTES[midi % 12] + (Math.floor(midi / 12) - 1); // midi 60 -> C4
    samples[id] = fetch(`${SAMPLE_URL}/${name}-mp3/${file}.mp3`)
      .then(r => r.arrayBuffer())
      .then(data => audio.decodeAudioData(data))
      .then(buf => samples[id] = buf)
      .catch(() => delete samples[id]); // try again next time
  }
  return samples[id];
}

function play(midi) {
  const buf = loadSample(midi);
  const out = audio.createGain();
  out.connect(audio.destination);
  const src = audio.createBufferSource();
  if (buf instanceof AudioBuffer) {
    src.buffer = buf;
    out.gain.value = 0.8;
  } else {
    // sample not downloaded yet (or offline): use a simple synthesized pluck instead
    src.buffer = pluckBuffer(440 * 2 ** ((midi - 69) / 12));
    out.gain.value = 0.35;
  }
  src.connect(out);
  src.start();
}

// Karplus-Strong plucked string: a burst of noise fed through a decaying delay line
function pluckBuffer(f) {
  const n = Math.floor(audio.sampleRate * 1.5);
  const buf = audio.createBuffer(1, n, audio.sampleRate);
  const d = buf.getChannelData(0);
  const period = Math.round(audio.sampleRate / f);
  for (let i = 0; i < n; i++) {
    d[i] = i < period ? Math.random() * 2 - 1 : 0.996 * 0.5 * (d[i - period] + (d[i - period + 1] || 0));
  }
  return buf;
}

function pluck(i) {
  const s = strings[i];
  if (performance.now() - s.hitAt < 120) return; // ignore jitter and several fingers crossing at once
  s.hitAt = performance.now();
  play(midiFor(i));
}

// ---------- geometry ----------
// do segments p0-p1 and a-b cross? (sign of the cross product on each side)
function crosses(p0, p1, a, b) {
  const side = (p, q, r) => (q.x - p.x) * (r.y - p.y) - (q.y - p.y) * (r.x - p.x);
  return side(a, b, p0) * side(a, b, p1) < 0 && side(p0, p1, a) * side(p0, p1, b) < 0;
}

// a point moved from p0 to p1 (fractions of the screen): pluck every string it crossed
function sweep(p0, p1) {
  if (Math.hypot(p1.x - p0.x, p1.y - p0.y) > 0.4) return; // tracking jump, not a real movement
  strings.forEach((s, i) => crosses(p0, p1, s.a, s.b) && pluck(i));
}

// ---------- touch ----------
const touches = {};
const touchPoint = e => ({ x: e.clientX / W, y: e.clientY / H });
canvas.addEventListener('pointerdown', e => touches[e.pointerId] = touchPoint(e));
canvas.addEventListener('pointermove', e => {
  if (!(e.pointerId in touches)) return;
  const p = touchPoint(e);
  sweep(touches[e.pointerId], p);
  touches[e.pointerId] = p;
});
const endTouch = e => delete touches[e.pointerId];
canvas.addEventListener('pointerup', endTouch);
canvas.addEventListener('pointercancel', endTouch);

// ---------- hand tracking ----------
let hands;
let tips = [];          // playing fingertips on screen this frame, for drawing
let skeletons = [];     // all 21 points of each hand, for drawing the hand
let prevTips = {};      // "Left-8" -> last position, for detecting crossings
const drafts = {};      // "Left"/"Right" -> string being drawn while that hand pinches

async function startCamera() {
  statusEl.textContent = 'Starting camera…';
  video.srcObject = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false,
  });
  await video.play();
  audio.resume(); // starting the camera can suspend audio on iOS
  statusEl.textContent = 'Loading hand tracking…';
  const base = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
  const { FilesetResolver, HandLandmarker } = await import(`${base}/vision_bundle.mjs`);
  const files = await FilesetResolver.forVisionTasks(`${base}/wasm`);
  const make = delegate => HandLandmarker.createFromOptions(files, {
    baseOptions: {
      modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
      delegate,
    },
    runningMode: 'VIDEO', numHands: 2,
  });
  hands = await make('GPU').catch(() => make('CPU'));
  statusEl.textContent = 'Pinch thumb and index, drag, let go to make a string';
  setTimeout(() => statusEl.textContent = '', 6000);
}

// video landmark -> fraction of the screen, matching object-fit: cover and the mirror flip
function toScreen(p) {
  const scale = Math.max(W / video.videoWidth, H / video.videoHeight);
  const dw = video.videoWidth * scale, dh = video.videoHeight * scale;
  return { x: 1 - ((W - dw) / 2 + p.x * dw) / W, y: ((H - dh) / 2 + p.y * dh) / H };
}

// thumb tip close to index tip, compared to the size of the hand.
// Different thresholds to start and stop, so it does not flicker at the edge.
function isPinching(lm, wasPinching) {
  const d = (i, j) => Math.hypot(lm[i].x - lm[j].x, lm[i].y - lm[j].y);
  return d(4, 8) / d(0, 9) < (wasPinching ? 0.45 : 0.3);
}

let lastVideoTime = -1;
function track() {
  if (!hands || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  const res = hands.detectForVideo(video, performance.now());
  const nowTips = {};
  tips = [];
  skeletons = res.landmarks.map(lm => lm.map(toScreen));

  const seen = [];
  res.landmarks.forEach((lm, i) => {
    const hand = res.handedness[i]?.[0]?.categoryName || String(i);
    seen.push(hand);
    if (isPinching(lm, hand in drafts)) {
      // pinch starts a string at the pinch point; dragging moves its other end
      const t = toScreen(lm[4]), f = toScreen(lm[8]);
      const p = { x: (t.x + f.x) / 2, y: (t.y + f.y) / 2 };
      drafts[hand] = drafts[hand] ? { a: drafts[hand].a, b: p } : { a: p, b: p };
      return; // a pinching hand is drawing, not playing
    }
    if (drafts[hand]) { // pinch released: keep the string if it is long enough
      addString(drafts[hand]);
      delete drafts[hand];
    }
    for (const id of TIPS) {
      const p = toScreen(lm[id]), key = hand + '-' + id;
      if (prevTips[key]) sweep(prevTips[key], p);
      nowTips[key] = p;
      tips.push(p);
    }
  });
  // a hand that left the frame while pinching cancels its string
  for (const hand in drafts) if (!seen.includes(hand)) delete drafts[hand];
  prevTips = nowTips;
}

function addString({ a, b }) {
  if (Math.hypot(a.x - b.x, a.y - b.y) < 0.1) return; // too short: probably not meant
  strings.push({ a, b, hitAt: -1e9 });
  if (strings.length > MAX_STRINGS) strings.shift();
  refresh();
  pluck(strings.length - 1);
}

// ---------- drawing ----------
function line(a, b, wobble, now) {
  ctx.beginPath();
  for (let t = 0; t <= 1.001; t += 0.05) {
    // bow sideways in the middle of the string, like a vibrating string
    const off = Math.sin(t * Math.PI) * Math.sin(now / 25) * wobble;
    const dx = (b.x - a.x) * W, dy = (b.y - a.y) * H, len = Math.hypot(dx, dy) || 1;
    const x = a.x * W + dx * t - dy / len * off, y = a.y * H + dy * t + dx / len * off;
    t ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();
}

function draw() {
  track();
  ctx.clearRect(0, 0, W, H);
  const now = performance.now();
  ctx.font = '600 13px system-ui';
  strings.forEach((s, i) => {
    const glow = Math.max(0, 1 - (now - s.hitAt) / 800);
    ctx.strokeStyle = `hsla(${45 - glow * 15}, 100%, ${70 + glow * 20}%, ${0.5 + glow * 0.5})`;
    ctx.lineWidth = 2 + glow * 3;
    line(s.a, s.b, glow * 6, now);
    const left = s.a.x < s.b.x ? s.a : s.b;
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.fillText(NOTES[midiFor(i) % 12], Math.max(8, Math.min(W - 40, left.x * W - 8)), left.y * H - 10);
  });
  ctx.setLineDash([8, 8]);
  ctx.strokeStyle = 'rgba(255,255,255,.9)';
  ctx.lineWidth = 2;
  for (const d of Object.values(drafts)) line(d.a, d.b, 0, now);
  ctx.setLineDash([]);
  ctx.strokeStyle = 'rgba(255,255,255,.6)';
  ctx.lineWidth = 2;
  for (const pts of skeletons) {
    ctx.beginPath();
    for (const [i, j] of BONES) { ctx.moveTo(pts[i].x * W, pts[i].y * H); ctx.lineTo(pts[j].x * W, pts[j].y * H); }
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(255,204,77,.9)';
  for (const t of tips) {
    ctx.beginPath(); ctx.arc(t.x * W, t.y * H, 7, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  for (const { b: p } of Object.values(drafts)) {
    ctx.beginPath(); ctx.arc(p.x * W, p.y * H, 10, 0, Math.PI * 2); ctx.fill();
  }
  requestAnimationFrame(draw);
}

// ---------- start ----------
// iPhones mute Web Audio when the silent switch is on. Asking for "playback" audio
// (newer iOS) and playing a silent audio element (older iOS) makes it play anyway.
function unlockAudio() {
  if (navigator.audioSession) navigator.audioSession.type = 'playback';
  const wav = new Uint8Array(844).fill(128); // 0.1 s of 8-bit silence at 8 kHz, as a WAV file
  const v = new DataView(wav.buffer);
  [[0, 'RIFF'], [8, 'WAVEfmt '], [36, 'data']].forEach(([at, txt]) => [...txt].forEach((c, i) => wav[at + i] = c.charCodeAt(0)));
  [[4, 836, 4], [16, 16, 4], [20, 1, 2], [22, 1, 2], [24, 8000, 4], [28, 8000, 4], [32, 1, 2], [34, 8, 2], [40, 800, 4]]
    .forEach(([at, n, size]) => size === 4 ? v.setUint32(at, n, true) : v.setUint16(at, n, true));
  const silence = new Audio(URL.createObjectURL(new Blob([wav], { type: 'audio/wav' })));
  silence.setAttribute('playsinline', '');
  silence.loop = true;
  silence.play().catch(() => {});
  audio.resume();
  // iOS can suspend audio again (camera start, phone call, app switch): resume on every touch
  addEventListener('pointerdown', () => audio.state !== 'running' && audio.resume());
}

function begin(withCamera) {
  audio = new (window.AudioContext || window.webkitAudioContext)(); // must be created on a tap for iOS
  unlockAudio();
  document.getElementById('start').remove();
  strings = withCamera ? [] : defaultStrings(); // camera: draw your own strings
  resize();
  refresh();
  draw();
  if (withCamera) startCamera().catch(err => {
    statusEl.textContent = 'Camera unavailable, use touch: ' + err.message;
  });
}
document.getElementById('camBtn').onclick = () => begin(true);
document.getElementById('touchBtn').onclick = () => begin(false);
</script>
</body>
</html>
